<!doctype html>
<html lang="pt-BR">
  <head>
    <link
      rel="icon"
      type="image/x-icon"
      sizes="any"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090a0c" />
    <meta
      name="description"
      content="Documentação da API Download YouTube com Scalar e OpenAPI 3.1."
    />
    <title>Documentação API — Download YouTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/docs.css') }}"
    />
  </head>
  <body>
    <header class="docs-header">
      <a class="docs-home" href="/" aria-label="Voltar à página principal">
        <span class="docs-symbol" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.7"
          >
            <path d="M12 3.5v13.5m0 0 5-5m-5 5-5-5" />
            <path
              d="M4.5 17.5v1.3a1.8 1.8 0 0 0 1.8 1.8h11.4a1.8 1.8 0 0 0 1.8-1.8v-1.3"
            />
          </svg>
        </span>
        <span>DOWNLOAD<span class="docs-brand-muted">YOUTUBE</span></span>
      </a>
      <nav class="docs-links" aria-label="Documentação">
        <span class="docs-current">API REFERENCE</span>
        <a href="/openapi.json" target="_blank" rel="noopener noreferrer"
          >OpenAPI JSON</a
        >
        <a href="/">Voltar ao site</a>
      </nav>
    </header>
    <main
      id="scalar-reference"
      aria-label="Documentação interativa da API"
    ></main>
    <noscript
      ><p class="docs-loading">
        Habilite o JavaScript para usar o Scalar ou abra
        <a href="/openapi.json">a especificação OpenAPI</a>.
      </p></noscript
    >
    <script
      type="module"
      src="{{ url_for('static', filename='js/docs.js') }}"
    ></script>
  </body>
</html>
